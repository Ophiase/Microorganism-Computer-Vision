reason = "tracks of 4 observations: the rods swim in and out of focus and blink under the cut; let a track coast 6 frames, half a second"

[acquisition]
pixel_size = 0.323

[preprocessing]
background = "temporal-median"
polarity = "dark"
window_low = 0.42
window_high = 0.5
gain = 1.0
smoothing = 3
exclude_static = 0.15
exclusion_margin = 4

[detection]
method = "fixed"
threshold = 0.5
opening = 0
min_area = 6
max_area = 60

[tracking]
max_assignment_distance = 15.0
max_missed_frames = 6
max_velocity = 50.0
process_noise = 1e-05
measurement_noise = 1e-05

[classification]
min_track_length = 20
lag_fraction = 0.33
min_lags = 5
circular_turns = 0.5
circular_significance = 0.999
min_step = 0.5
turning_stride = 3

[clip]
start = 0
stop = 80
