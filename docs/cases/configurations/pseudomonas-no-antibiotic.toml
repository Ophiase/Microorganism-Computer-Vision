reason = "PSA-no-antibiotic: Pseudomonas as small dark dots inside a capillary, contrast 0.05 over noise 0.006; outside the capillary and the dark band masked by hand: the light is too uneven for the level; no scale bar, so pixels"

[acquisition]

[preprocessing]
background = "temporal-median"
polarity = "dark"
window_low = 0.45
window_high = 0.5
gain = 1.0
smoothing = 3
even_exposure = true

[preprocessing.mask]
margin = 6
ignore = []
keep = []
inside = []

[[preprocessing.mask.ignore_regions]]
points = [
    [
        590.0,
        0.0,
    ],
    [
        1280.0,
        0.0,
    ],
    [
        1280.0,
        1024.0,
    ],
    [
        820.0,
        1024.0,
    ],
]

[[preprocessing.mask.ignore_regions]]
points = [
    [
        0.0,
        0.0,
    ],
    [
        590.0,
        0.0,
    ],
    [
        650.0,
        140.0,
    ],
    [
        0.0,
        280.0,
    ],
]

[[preprocessing.mask.ignore_regions]]
points = [
    [
        0.0,
        885.0,
    ],
    [
        840.0,
        695.0,
    ],
    [
        820.0,
        1024.0,
    ],
    [
        0.0,
        1024.0,
    ],
]

[detection]
method = "fixed"
threshold = 0.5
opening = 0
area = "pixels"
min_area = 3
max_area = 40
min_elongation = 1.0
static_cells = false

[tracking]
max_assignment_distance = 15.0
max_missed_frames = 3
max_velocity = 50.0
process_noise = 1e-05
measurement_noise = 1e-05

[classification]
min_track_length = 20
lag_fraction = 0.33
min_lags = 5
circular_turns = 0.5
circular_significance = 0.999
min_step = 0.5
turning_stride = 3

[clip]
start = 0
stop = 150
