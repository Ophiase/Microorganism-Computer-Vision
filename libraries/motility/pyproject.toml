[project]
name = "motility"
version = "0.9.0"
description = "Read bacterial motility from video: filters, tracking and diffusion tests."
requires-python = ">=3.14"
license = "Apache-2.0"
dependencies = [
  "numpy>=2.5",
  "opencv-python-headless>=4.13",
  "pydantic>=2.12",
  "scipy>=1.18",
]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src/motility"]
