[project]
name = "microorganism-computer-vision"
version = "0.7.0"
description = "Track Salmonella Typhimurium in video and decide its motility pattern from the trajectories."
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
keywords = [
  "computer-vision",
  "motility",
  "optical-flow",
  "trajectory-analysis",
  "diffusion",
]
dependencies = [
  "kaleido>=1.2.0",
  "matplotlib>=3.11",
  "motility",
  "numpy>=2.5",
  "opencv-python>=4.13",
  "pillow>=13.0",
  "plotly>=7.1",
  "requests>=2.34",
]

[dependency-groups]
dev = ["pytest>=9.1", "ruff>=0.15", "ty>=0.0.39"]

[project.scripts]
microorganism-computer-vision = "microorganism_computer_vision.__main__:main"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src/microorganism_computer_vision"]

[tool.uv.workspace]
members = ["libraries/*"]

[tool.uv.sources]
motility = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests", "libraries/motility/tests"]
addopts = ["--strict-markers", "--strict-config", "--import-mode=importlib"]
